name: CatAni 원격 저장소

on:
  workflow_run:
    workflows: [CatAni 릴리스]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: catani-pages
  cancel-in-progress: false

jobs:
  build:
    name: 공개 릴리스로 저장소 생성
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: 기본 브랜치의 배포 도구 가져오기
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Python 준비
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - name: Blender 공식 바이너리 검증 및 설치
        run: python .github/scripts/setup_blender.py
      - name: 공개 ZIP 수집 및 공식 index.json 생성
        env:
          GH_TOKEN: ${{ github.token }}
        run: python .github/scripts/build_repository.py
      - name: Pages 산출물 보관
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: site
  deploy:
    name: Blender 원격 저장소 배포
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: GitHub Pages 배포
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
