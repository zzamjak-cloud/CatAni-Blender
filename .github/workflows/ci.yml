name: CatAni 검사

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      release_tag:
        description: 검증할 릴리스 태그
        required: false
        type: string
        default: ''

permissions:
  contents: read

jobs:
  test:
    name: Blender 5.2 / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - name: 소스 가져오기
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Python 준비
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - name: Blender 공식 바이너리 검증 및 설치
        run: python .github/scripts/setup_blender.py
      - name: 버전과 배포 파일 검사
        run: python scripts/validate_release.py
      - name: 원격 저장소 무결성 회귀 검사
        run: python .github/scripts/test_distribution.py
      - name: 릴리스 태그 일치 검사
        if: inputs.release_tag != ''
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        shell: bash
        run: python scripts/validate_release.py --tag "$RELEASE_TAG"
      - name: 전체 회귀 검사와 격리 Blender 검사
        run: python scripts/run_tests.py
      - name: 공식 Extension ZIP 생성 및 검증
        run: python scripts/package.py
      - name: 검증된 배포 자산 보관
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: catani-release-package
          path: |
            dist/catani-v*.zip
            dist/catani-v*.zip.sha256
          if-no-files-found: error
          retention-days: 14
